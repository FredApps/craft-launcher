name: CI
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install Linux system dependencies (egui/winit)
      if: runner.os == 'Linux'
      run: "sudo apt-get update\nsudo apt-get install -y --no-install-recommends \\\n  libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev\n"
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - name: Format
      if: runner.os == 'Linux'
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --workspace --locked
  wasm:
    name: wasm32 check + trunk build
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: 0.21.14
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        targets: wasm32-unknown-unknown
        components: clippy
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        key: wasm32
    - name: Check wasm-safe crates
      run: cargo xtask wasm
    - name: Clippy (wasm32)
      run: cargo clippy -p artcraft-launcher-core -p artcraft-launcher-web --target wasm32-unknown-unknown --locked -- -D warnings
    - name: Install trunk
      run: "curl --proto '=https' -fsSL \"https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz\" \\\n  | tar -xz -C \"$HOME/.cargo/bin\" trunk\ntrunk --version\n"
    - name: Build and zip the web app
      run: packaging/web/package.sh
permissions:
  contents: read
